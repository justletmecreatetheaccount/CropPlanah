<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvine Commons // garden mesh</title>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="web/regional/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <!-- point this at your community page -->
      <nav class="corner corner-left">
        <a class="btn" href="community">&#9670; community</a>
      </nav>

      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-title">Almanac — South District </span>
        <span class="brand-subtitle">REGION</span>
      </div>
      <!-- <div class="site-id"> -->
      <!-- <h1>Almanac - South District</h1> -->
      <!-- <span class="brand-subtitle">COMMUNITY</span> -->
      <!-- </div> -->

      <nav class="corner corner-right">
        <button class="btn_disease" id="btn-disease" aria-haspopup="dialog">
          &#9679; declare disease
        </button>
      </nav>
    </header>

    <dialog id="disease-card">
      <form id="disease-form" method="dialog">
    <h3 class="dialog-title">Declare an outbreak</h3>
    <p class="dialog-sub">Filed in one step, confirmed by someone else before it counts.</p>

    <div class="field">
      <label for="dis-pathogen">Pathogen <span class="req" aria-hidden="true">*</span></label>
      <select id="dis-pathogen" name="pathogen_id" required>
        <option value="">-- from the list --</option>
<!--         <option value="1">late blight (Phytophthora infestans)</option>
        <option value="2">apple scab (Venturia inaequalis)</option>
        <option value="3">powdery mildew (Podosphaera leucotricha)</option>
        <option value="4">downy mildew (Peronospora belbahrii)</option>
        <option value="5">early blight (Alternaria solani)</option> -->
      </select>
      <p class="field-hint">the list lives in the database, no freeform</p>
    </div>

    <div class="field">
      <label for="dis-crop">Crop</label>
      <select id="dis-crop" name="crop_id" required>
        <option value=""> -- from the list -- </option>
<!--         <option value="1">potato</option>
        <option value="2">tomato</option>
        <option value="3">carrot</option>
        <option value="4">dry beans</option>
        <option value="5">apple</option>
        <option value="6">garlic</option>
        <option value="7">pear</option>
        <option value="8">squash</option>
        <option value="9">basil</option> -->
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="dis-lat">Latitude</label>
        <input type="number" step="0.001" id="dis-lat" name="lat" required>
      </div>
      <div class="field">
        <label for="dis-lon">Longitude</label>
        <input type="number" step="0.001" id="dis-lon" name="lon" required>
      </div>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn" id="dis-cancel">cancel</button>
      <button type="submit" class="btn">declare</button>
    </div>

    <p class="form-status" id="dis-status" hidden></p>
  </form>
    </dialog>

    <main class="board">
      <section class="panel panel-map">
        <h2 class="panel-title">Territory</h2>
        <div class="map-wrap">
          <div class="overlay-picker">
            <button
              type="button"
              class="overlay-btn active"
              data-overlay="none"
            >
              nothing
            </button>
            <button type="button" class="overlay-btn" data-overlay="rain">
              rain
            </button>
            <button type="button" class="overlay-btn" data-overlay="diseases">
              plant diseases
            </button>
            <button type="button" class="overlay-btn" data-overlay="wind">
              wind
            </button>
            <button
              type="button"
              class="overlay-btn"
              data-overlay="temperature"
            >
              temperatures
            </button>
          </div>
          <div id="map" class="map-canvas"></div>
        </div>
        <p class="attr">OpenMeteo and OpenStreetMap</p>
      </section>

      <div class="board-right">
        <section class="panel panel-warnings">
          <h2 class="panel-title">Disease warnings</h2>
          <ul id="warnings" class="warnings"></ul>
        </section>

        <section class="panel panel-trades">
          <h2 class="panel-title">Community trading balance</h2>
          <div class="ledger">
            <div id="ledger-entry"></div>
            <div class="ledger-controls">
              <label class="visually-hidden" for="ledger-slider"
                >ledger position</label
              >
              <input
                type="range"
                id="ledger-slider"
                min="0"
                value="0"
                step="1"
              />
              <p id="ledger-position" class="ledger-position"></p>
            </div>
            <div class="balance-meter" aria-hidden="true">
              <div class="balance-scale"></div>
              <div id="balance-bar" class="balance-bar"></div>
            </div>
            <p id="balance-readout" class="balance-readout"></p>
          </div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="web/regional/app.js"></script>
  </body>
</html>
