<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarHub</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="signin.css">
</head>
<body>

  <main class="container main-content">
    <header class="page-header">
      <div>
        <h1 class="page-title">Who are you ?</h1>
      </div>
      <p class="page-lead">
        Log in to your user account or sign up to join the community.
      </p>
    </header>

    <div class="auth-grid">
      <!-- Returning members -->
      <section class="panel" aria-labelledby="login-title">
        <h2 id="login-title" class="panel-title">Log in</h2>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email <span class="req" aria-hidden="true">*</span></label>
            <input type="email" id="login-email" name="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">Password <span class="req" aria-hidden="true">*</span></label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-submit">Log in</button>
          <p class="form-status" id="login-status" hidden></p>
        </form>
      </section>

      <!-- New members: fields are rendered by signin.js from SIGNUP_FIELDS -->
      <section class="panel" aria-labelledby="signup-title">
        <h2 id="signup-title" class="panel-title">Sign up</h2>
        <form id="signup-form" novalidate>
          <!-- Injected by signin.js -->
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">

  </footer>

  <script src="signin.js"></script>
</body>
</html>
